name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Запуск всех шагов внутри вашего подготовленного Docker-контейнера
    container:
      image: ghcr.io/letis-1987/apk-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Run build script
        run: ./build.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-qml-app-apk
          # CMake по умолчанию собирает APK файлы в директорию android-build внутри папки сборки
          path: build/android-build//**/*.apk
