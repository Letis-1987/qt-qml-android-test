name: Build Qt QML Android APK

on:
  workflow_dispatch:  # <-- вот эта строчка даёт кнопку в интерфейсе

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Запускаем все шаги сборки внутри указанного Docker-образа
    container:
      image: ghcr.io/letis-1987/apk-builder:latest

    steps:
      # Step 1: Клонируем исходный код нашего проекта в контейнер
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Конфигурируем проект с помощью qt-cmake (это избавит от кучи флагов)
      # Используем абсолютные пути, которые гарантированно есть внутри вашего Docker-образа
      - name: Configure CMake
        run: |
          /opt/qt/6.8.0/android_arm64_v8a/bin/qt-cmake -G "Ninja" \
            -S . \
            -B build_android \
            -DCMAKE_TOOLCHAIN_FILE="/opt/android-sdk/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="latest"

      # Step 3: Компиляция C++ кода через Ninja
      - name: Build with Ninja
        run: cmake --build build_android --target all

      # Step 4: Упаковка в финальный APK файл
      - name: Generate APK Package
        run: cmake --build build_android --target apk

      # Step 5: Сохраняем готовый APK как артефакт сборки GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: build_android/android-build/build/outputs/apk/debug/android-build-debug.apk
